script: tools/project_generator/preset.bat
path:
  HPM_SDK_BASE: hpm_sdk
  GNURISCV_TOOLCHAIN_PATH: toolchains/rv32imac_zicsr_zifencei_multilib_b_ext-win
  CMAKE: tools/cmake
  NINJA: tools/ninja
  OPENOCD: tools/openocd
  PYTHON3: tools/python3
env:
  HPM_SDK_BASE: ~
  GNURISCV_TOOLCHAIN_PATH: ~
  HPM_SDK_TOOLCHAIN_VARIANT:
    - gcc
    - nds-gcc
    - nds-llvm
    - zcc
hpm-build-type:
  ram: ~
  flash_xip: ~
  flash_sdram_xip:
    on-board-ram: [sdram]
  flash_uf2:
    feature: ~
  flash_sdram_uf2:
    on-board-ram: [sdram]
    feature: ~
  flash_dfu:
    feature: ~
  flash_sdram_dfu:
    on-board-ram: [sdram]
    feature: ~
  sec_core_img:
    feature: [multicore]
  flash_xip_hybrid:
    feature: [hybrid_xpi]
cmake-build-type:
  - debug
  - release
default-type:
  default: [flash_sdram_xip, flash_xip]
  HPM6E80: [flash_xip, flash_sdram_xip]
default-sample: hello_world
default-board: hpm6750evkmini
custom-board-path: D:/v113test/sdk_env_v1.13.0/user_template/boards
output-directory: D:/v113test
setting:
  language-chinese: 1
  show-multicore-core1: 1
last-used-sample: hello_world
custom-sample-path: D:/v113test/sdk_env_v1.13.0/user_template/projects